[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"

# Redirects for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Редирект несуществующих языковых роутов на главную
[[redirects]]
  from = "/ru/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/uz/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/en/*"
  to = "/"
  status = 301

# Редирект домена с www на без www (если используется www поддомен)
[[redirects]]
  from = "https://www.tamexgroup.com/*"
  to = "https://tamexgroup.com/:splat"
  status = 301
  force = true